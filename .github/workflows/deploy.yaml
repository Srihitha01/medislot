
name: MediSlot CI/CD

on:
  push:
    branches:
      - feature/network-stack
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  STACK_NAME: medislot-network-dev
  TEMPLATE_FILE: cloudformation/network-stack.yaml

jobs:
  validate:
    name: Validate CloudFormation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check template exists
        run: test -s "$TEMPLATE_FILE"

      - name: Validate YAML template
        run: |
          python -m pip install cfn-lint
          cfn-lint "$TEMPLATE_FILE"

      - name: Validate CloudFormation template
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: AWS template validation
        if: github.event_name != 'pull_request'
        run: |
          aws cloudformation validate-template \
            --template-body "file://$TEMPLATE_FILE"

  prepare-change-set:
    name: Create CloudFormation Change Set
    needs: validate
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    outputs:
      change_set_name: ${{ steps.changeset.outputs.name }}
      change_set_type: ${{ steps.changeset.outputs.type }}
      has_changes: ${{ steps.changeset.outputs.has_changes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create Change Set
        id: changeset
        shell: bash
        run: |
          set -euo pipefail

          STACK="$STACK_NAME"
          CHANGE_SET="network-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          if aws cloudformation describe-stacks \
            --stack-name "$STACK" >/dev/null 2>&1; then
            TYPE="UPDATE"
          else
            TYPE="CREATE"
          fi

          echo "name=$CHANGE_SET" >> "$GITHUB_OUTPUT"
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"

          if aws cloudformation create-change-set \
            --stack-name "$STACK" \
            --change-set-name "$CHANGE_SET" \
            --change-set-type "$TYPE" \
            --template-body "file://$TEMPLATE_FILE" \
            --parameters \
              ParameterKey=Environment,ParameterValue=dev \
            --capabilities CAPABILITY_IAM \
            --description "MediSlot network deployment ${GITHUB_SHA}"; then
            echo "Change Set creation requested."
          else
            echo "Change Set creation failed."
            exit 1
          fi

          for attempt in {1..30}; do
            STATUS=$(aws cloudformation describe-change-set \
              --stack-name "$STACK" \
              --change-set-name "$CHANGE_SET" \
              --query Status --output text 2>/dev/null || true)

            if [ "$STATUS" = "CREATE_COMPLETE" ]; then
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$STATUS" = "FAILED" ]; then
              REASON=$(aws cloudformation describe-change-set \
                --stack-name "$STACK" \
                --change-set-name "$CHANGE_SET" \
                --query StatusReason --output text)

              if [[ "$REASON" == *"didn't contain changes"* ]] ||
                 [[ "$REASON" == *"No updates are to be performed"* ]]; then
                echo "has_changes=false" >> "$GITHUB_OUTPUT"
                echo "No infrastructure changes required."
                exit 0
              fi

              echo "$REASON"
              exit 1
            fi

            sleep 10
          done

          echo "Timed out waiting for Change Set."
          exit 1

      - name: Display proposed changes
        if: steps.changeset.outputs.has_changes == 'true'
        run: |
          aws cloudformation describe-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "${{ steps.changeset.outputs.name }}" \
            --query 'Changes[*].ResourceChange.[Action,LogicalResourceId,ResourceType]' \
            --output table

  deploy:
    name: Execute Approved Change Set
    needs: prepare-change-set
    if: needs.prepare-change-set.outputs.has_changes == 'true'
    runs-on: ubuntu-latest

    # Configure this GitHub Environment with required reviewers.
    environment: dev

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Execute Change Set
        run: |
          aws cloudformation execute-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "${{ needs.prepare-change-set.outputs.change_set_name }}"

          aws cloudformation wait stack-create-complete \
            --stack-name "$STACK_NAME" || \
          aws cloudformation wait stack-update-complete \
            --stack-name "$STACK_NAME"

      - name: Deployment summary
        if: success()
        run: |
          echo "## MediSlot Network Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Stack: $STACK_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "Region: $AWS_REGION" >> "$GITHUB_STEP_SUMMARY"
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs' \
            --output table >> "$GITHUB_STEP_SUMMARY"
